dataset:
  name: Student_Performance_Teaching_Effectiveness_v1.csv
  path: data/raw/Student_Performance_Teaching_Effectiveness.csv
  target: Student_Performance

preprocessing:
  version: v1_median_impute_scaler_onehot
  feature_set_version: v1_6_raw_plus_2_engineered

split:
  test_size: 0.2
  cv_folds: 10
  random_state: 42

models:
  dummy:
    name: Dummy (Most Frequent)
    strategy: most_frequent

  decision_tree:
    name: Decision Tree
    class_weight: balanced
    max_depth: 8
    min_samples_leaf: 20

  random_forest:
    name: Random Forest
    n_estimators: 100
    class_weight: balanced
    max_depth: 12
    min_samples_leaf: 3

output:
  model_path: models/student_performance_pipeline.joblib